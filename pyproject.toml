[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coindcx-mt5-bridge"
version = "0.1.0"
description = "A safe CoinDCX Spot REST client and MT5-style order adapter"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["coindcx_mt5*"]
